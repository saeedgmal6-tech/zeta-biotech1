name: ZETA BIOTECH Enhancements
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate enhancement layers safely
        shell: python
        run: |
          from pathlib import Path
          import re

          def inject(path, tag):
              p=Path(path)
              if not p.exists(): return False
              s=p.read_text(encoding='utf-8')
              if tag in s: return False
              marker='</body>'
              if marker not in s: return False
              s=s.replace(marker, tag+'\n'+marker, 1)
              p.write_text(s, encoding='utf-8')
              return True

          changed=False
          changed |= inject('index.html','<script src="/public-enhancements.js?v=20260904" defer></script>')
          changed |= inject('product-details.html','<script src="/public-enhancements.js?v=20260904" defer></script>')
          changed |= inject('news-details.html','<script src="/public-enhancements.js?v=20260904" defer></script>')
          changed |= inject('admin/index.html','<script src="/admin/enhancements.js?v=20260904" defer></script>')

          wp=Path('worker.js')
          w=wp.read_text(encoding='utf-8')
          old='  "content/news.json"\n]);'
          new='  "content/news.json",\n  "content/certifications.json",\n  "content/jobs.json",\n  "content/leads.json",\n  "content/analytics.json"\n]);'
          if old in w and 'content/analytics.json' not in w:
              w=w.replace(old,new,1); changed=True

          marker='async function handleUpload(request, env) {'
          if 'async function handlePublicLead' not in w and marker in w:
              helpers=r'''
async function handlePublicLead(request, env) {
  if (request.method !== "POST") return json({ ok: false, error: "Method not allowed" }, 405);
  let body;
  try { body = await request.json(); } catch { return json({ ok: false, error: "Invalid JSON." }, 400); }
  const lead = {
    id: crypto.randomUUID(), date: new Date().toISOString(), status: "New",
    name: String(body.name || "").trim().slice(0,120), company: String(body.company || "").trim().slice(0,160),
    email: String(body.email || "").trim().slice(0,180), phone: String(body.phone || "").trim().slice(0,80),
    subject: String(body.subject || "").trim().slice(0,180), message: String(body.message || "").trim().slice(0,4000), lang: String(body.lang || "ar").slice(0,5)
  };
  if (!lead.name || !lead.message) return json({ ok: false, error: "Name and message are required." }, 400);
  const current = await githubGetFile(env, "content/leads.json");
  if (!current.ok) return json({ ok: false, error: current.error }, current.status);
  let data = { leads: [] };
  if (current.exists) { try { data = JSON.parse(current.content); } catch {} }
  if (!Array.isArray(data.leads)) data.leads = [];
  data.leads.unshift(lead);
  data.leads = data.leads.slice(0, 1000);
  const result = await githubPutFile(env, "content/leads.json", JSON.stringify(data, null, 2) + "\n", "New website contact lead", false);
  if (!result.ok) return json({ ok: false, error: result.error }, result.status);
  return json({ ok: true, id: lead.id });
}

async function handlePublicAnalytics(request, env) {
  if (request.method !== "POST") return json({ ok: false, error: "Method not allowed" }, 405);
  let body;
  try { body = await request.json(); } catch { return json({ ok: false, error: "Invalid JSON." }, 400); }
  const type = String(body.type || "page").slice(0,20);
  const id = String(body.id || body.path || "unknown").slice(0,180).replace(/[^A-Za-z0-9._\/-]/g, "_");
  const current = await githubGetFile(env, "content/analytics.json");
  if (!current.ok) return json({ ok: false, error: current.error }, current.status);
  let data = { pageViews: 0, productViews: {}, newsViews: {}, brochureViews: {} };
  if (current.exists) { try { data = JSON.parse(current.content); } catch {} }
  if (type === "page") data.pageViews = Number(data.pageViews || 0) + 1;
  else if (type === "product") data.productViews[id] = Number(data.productViews[id] || 0) + 1;
  else if (type === "news") data.newsViews[id] = Number(data.newsViews[id] || 0) + 1;
  else if (type === "brochure") data.brochureViews[id] = Number(data.brochureViews[id] || 0) + 1;
  const result = await githubPutFile(env, "content/analytics.json", JSON.stringify(data, null, 2) + "\n", "Website analytics update", false);
  if (!result.ok) return json({ ok: false, error: result.error }, result.status);
  return json({ ok: true });
}

'''
              w=w.replace(marker,helpers+marker,1); changed=True

          asset='  return env.ASSETS.fetch(request);'
          if 'handlePublicLead(request, env)' not in w and asset in w:
              routes=r'''
  if (url.pathname === "/api/leads") return handlePublicLead(request, env);
  if (url.pathname === "/api/analytics") return handlePublicAnalytics(request, env);
  if (url.pathname === "/admin/index.html") {
    const session = await requireAdmin(request, env);
    if (!session) return Response.redirect(new URL("/admin/login.html", url), 302);
  }
'''
              w=w.replace(asset,routes+asset,1); changed=True

          wp.write_text(w,encoding='utf-8')

          if changed:
              import subprocess
              subprocess.run(['git','config','user.name','ZETA BIOTECH Automation'],check=True)
              subprocess.run(['git','config','user.email','actions@zeta-biotech.com'],check=True)
              subprocess.run(['git','add','index.html','product-details.html','news-details.html','admin/index.html','worker.js'],check=True)
              subprocess.run(['git','diff','--cached','--quiet'])
              if subprocess.run(['git','diff','--cached','--quiet']).returncode != 0:
                  subprocess.run(['git','commit','-m','Integrate ZETA BIOTECH enhancement layers [skip ci]'],check=True)
                  subprocess.run(['git','push','origin','HEAD:main'],check=True)
          print('Integration completed:', changed)
