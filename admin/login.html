<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تسجيل دخول الإدارة — ZETA BIOTECH</title>
<link rel="stylesheet" href="../styles.css">
<style>
body{min-height:100vh;display:grid;place-items:center;background:#f3f4f6;font-family:Arial,sans-serif}.login-card{width:min(420px,calc(100% - 32px));background:#fff;padding:32px;border-radius:18px;box-shadow:0 18px 50px rgba(0,0,0,.1)}.login-logo{text-align:center;margin-bottom:24px}.login-logo img{width:90px;height:90px;object-fit:contain}.login-logo h1{margin:12px 0 4px}.login-logo p{margin:0;color:#666}.field{margin:16px 0}.field label{display:block;margin-bottom:7px;font-weight:700}.field input{box-sizing:border-box;width:100%;padding:13px 14px;border:1px solid #d5d7da;border-radius:10px;font-size:16px}.submit{width:100%;border:0;border-radius:10px;padding:14px;background:#111;color:#fff;font-size:16px;font-weight:700;cursor:pointer}.error{display:none;background:#fff0f0;color:#a40000;border-radius:10px;padding:11px;margin-bottom:14px}.back{text-align:center;margin-top:18px}.back a{color:#111}
</style>
</head>
<body>
<div class="login-card">
<div class="login-logo"><img src="../assets/zeta-logo.png" alt="ZETA BIOTECH"><h1>Super Admin</h1><p>ZETA BIOTECH</p></div>
<div id="error" class="error"></div>
<form id="loginForm">
<div class="field"><label for="username">اسم المستخدم</label><input id="username" name="username" autocomplete="username" required></div>
<div class="field"><label for="password">كلمة المرور</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
<button class="submit" type="submit">تسجيل الدخول</button>
</form>
<div class="back"><a href="../">العودة إلى الموقع</a></div>
</div>
<script>
(async function(){try{const r=await fetch('../api/admin/me',{cache:'no-store'});if(r.ok)location.replace('./');}catch(e){}})();
const form=document.getElementById('loginForm');const error=document.getElementById('error');
form.addEventListener('submit',async function(e){e.preventDefault();error.style.display='none';const button=form.querySelector('button');button.disabled=true;button.textContent='جارٍ تسجيل الدخول...';try{const r=await fetch('../api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});const data=await r.json();if(!r.ok)throw new Error(data.error||'فشل تسجيل الدخول');location.replace('./');}catch(e){error.textContent=e.message;error.style.display='block';button.disabled=false;button.textContent='تسجيل الدخول';}});
</script>
</body>
</html>
